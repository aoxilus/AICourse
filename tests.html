<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dashboard - Python Learning Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🧪 Test Dashboard</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">← Back to App</a>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-3">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <h2 class="mb-0">Automated Test Status</h2>
                <button id="run-tests-btn" class="btn btn-primary">Run All Tests</button>
            </div>
        </div>

        <div id="summary-alert" class="alert alert-info d-none"></div>

        <div id="tests-list" class="list-group mb-4">
            <!-- Filled by JavaScript -->
        </div>

        <div class="card">
            <div class="card-header">
                <strong>Details</strong>
            </div>
            <div class="card-body">
                <pre id="details-output" class="mb-0" style="white-space: pre-wrap; font-size: 0.85rem;"></pre>
            </div>
        </div>
    </div>

    <script>
        const suitesMeta = [
            { id: 'security', label: 'Security tests' },
            { id: 'api', label: 'API/structure tests' },
            { id: 'levels', label: 'Level solution tests' },
            { id: 'ai', label: 'AI helper tests' }
        ];

        function renderInitialList() {
            const list = document.getElementById('tests-list');
            list.innerHTML = '';
                suitesMeta.forEach(suite => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                item.id = 'suite-' + suite.id;
                item.innerHTML = `
                    <span>
                        <span class="badge bg-secondary me-2" id="status-${suite.id}">⏳</span>
                        ${suite.label}
                    </span>
                    <small class="text-muted" id="meta-${suite.id}">Not run yet</small>
                `;
                item.addEventListener('click', () => showDetailsForSuite(suite.id));
                list.appendChild(item);
            });
        }

        let lastResults = null;

        function showDetailsForSuite(id) {
            if (!lastResults) return;
            const suite = lastResults.suites.find(s => s.id === id);
            if (!suite) return;
            const details = document.getElementById('details-output');
            const statusLine = suite.passed ? 'Status: PASSED ✅' : 'Status: FAILED ❌';
            const header = `[${suite.label}] ${statusLine}\n\n`;
            const body = suite.passed ? (suite.output || '').trim() : (suite.error || suite.output || '').trim();
            details.textContent = header + (body || '(no output)');
        }

        async function runTests() {
            const btn = document.getElementById('run-tests-btn');
            const summary = document.getElementById('summary-alert');
            const details = document.getElementById('details-output');

            btn.disabled = true;
            btn.textContent = 'Running...';
            summary.className = 'alert alert-info';
            summary.textContent = 'Running test suites...';
            summary.classList.remove('d-none');
            details.textContent = '';

            try {
                const res = await fetch('/api/tests/run');
                const data = await res.json();
                if (!data.success) {
                    summary.className = 'alert alert-danger';
                    summary.textContent = 'Failed to run tests: ' + (data.error || 'Unknown error');
                    return;
                }

                lastResults = data;

                const failedSuites = [];

                data.suites.forEach(suite => {
                    const statusBadge = document.getElementById('status-' + suite.id);
                    const meta = document.getElementById('meta-' + suite.id);
                    const row = document.getElementById('suite-' + suite.id);
                    if (!statusBadge || !meta || !row) return;
                    row.classList.remove('list-group-item-danger', 'list-group-item-success');

                    if (suite.passed) {
                        statusBadge.textContent = '✅';
                        statusBadge.className = 'badge bg-success me-2';
                        meta.textContent = 'Passed';
                        row.classList.add('list-group-item-success');
                    } else {
                        statusBadge.textContent = '❌';
                        statusBadge.className = 'badge bg-danger me-2';
                        meta.textContent = 'Failed';
                        row.classList.add('list-group-item-danger');
                        failedSuites.push(suite.label);
                    }
                });

                const { passed, failed, total } = data.summary;
                if (failed === 0) {
                    summary.className = 'alert alert-success';
                    summary.textContent = `All ${total} test suites passed ✅`;
                } else {
                    const failedList = failedSuites.join(', ');
                    summary.className = 'alert alert-warning';
                    summary.textContent = `${passed} passed, ${failed} failed out of ${total} test suites. Failed: ${failedList}`;
                }

                // Auto-select first failed suite if any, otherwise first suite
                const firstFailed = failedSuites.length
                    ? data.suites.find(s => !s.passed)
                    : data.suites[0];
                if (firstFailed) {
                    showDetailsForSuite(firstFailed.id);
                }
            } catch (err) {
                summary.className = 'alert alert-danger';
                summary.textContent = 'Error running tests: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run All Tests';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderInitialList();
            document.getElementById('run-tests-btn').addEventListener('click', runTests);
        });
    </script>
</body>
</html>
